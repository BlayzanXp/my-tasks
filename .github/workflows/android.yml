name: Build My Tasks APK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/MyTasks/settings.gradle.kts
      - name: Build APK
        run: cd extracted/MyTasks && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyTasks-debug-apk
          path: extracted/MyTasks/app/build/outputs/apk/debug/app-debug.apk
